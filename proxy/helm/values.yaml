image:
  repository: ghcr.io/pdxlab/agentcert-tag/mcp-trust-proxy
  tag: latest
  pullPolicy: IfNotPresent
replicaCount: 2
service:
  type: ClusterIP
  port: 8081
mode: shadow                 # shadow | enforce
upstream: ""                 # single-upstream URL; or use `config` for multi
anchorsPem: ""               # trust-anchor bundle (PEM); mounted at /anchors/anchors.pem
config: {}                   # full config object (multi-upstream, guardrails); overrides `upstream`
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
