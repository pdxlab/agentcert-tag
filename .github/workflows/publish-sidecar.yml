name: publish-sidecar

# Builds the TAG verify sidecar image and pushes it to GHCR
# (ghcr.io/pdxlab/agentcert-tag/sidecar) so any gateway/firewall that can make an
# HTTP ext_authz / webhook callout can run it. No stored credential — GITHUB_TOKEN
# has packages:write in-repo.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/sidecar
          tags: |
            type=raw,value=latest
            type=raw,value=0.2.0
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sidecar/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
