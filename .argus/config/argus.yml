# Argus config — agentcert-tag (TAG verifier: Python core + TS/Lua wrappers).
# Vendored from karlmehta/argus. This repo is a security boundary — the verifier
# decides whether a calling agent's AgentCert + TrustScore is trusted — so the
# crypto/verification core gets one severity higher.

version: 1

skills:
  - security
  - data-protection
  - correctness
  - concurrency
  - performance
  - api-compat
  - tests
  - dependencies

gate: major

verdict:
  # Jayesh #3 review — never state branch-protection facts in repo files;
  # protection settings move and leave stale assertions that Argus reads as
  # evidence. The reason to withhold APPROVE on a trust-boundary repo stands
  # on its own: the verifier is the boundary, so sign-off is a human
  # decision, not an automated one.
  allow_approve: false
  never_approve_authors:
    - "dependabot[bot]"
    - "renovate[bot]"
    - "argus[bot]"

paths:
  skip:
    - "**/*.lock"
    - "**/dist/**"
    - "**/node_modules/**"
    - "**/*.d.ts"
    - "**/*.egg-info/**"
  # The trust boundary. Extra scrutiny — a bypass here is an auth bypass.
  strict:
    - "core/agentcert_tag/verify.py"
    - "core/agentcert_tag/pop.py"
    - "core/agentcert_tag/trust.py"
    - "core/agentcert_tag/oids.py"
    - "kong/**"
    - "sidecar/**"
    - "packages/**"
    # Jayesh #3 review. Both merged after this PR was opened:
    #   proxy/        — data-path trust boundary (proxy/THREAT_MODEL.md).
    #   integrations/ — recipes set failOpen / failure_mode_allow, which
    #                   decide whether a verifier outage lets traffic through.
    - "proxy/**"
    - "integrations/**"

limits:
  max_inline_comments: 15
  max_diff_lines: 4000

model: ""
